name: Container build

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container-build.yml
      - scripts/publish-container.sh
      - samples/getting-started/azure-postgresql/library.postgresql.sql
      - src/**
      - schemas/**
      - Nuget.config
      - global.json
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container-build.yml
      - scripts/publish-container.sh
      - samples/getting-started/azure-postgresql/library.postgresql.sql
      - src/**
      - schemas/**
      - Nuget.config
      - global.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, runtime-nonroot]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dab
          POSTGRES_PASSWORD: dab
          POSTGRES_DB: dab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dab -d dab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check publishing script syntax
        run: bash -n scripts/publish-container.sh
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: dab:container-test
      - name: Check runtime, application architecture, and native launcher
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --entrypoint sh dab:container-test -ec '
            dotnet --info
            test -s /App/dab-config.json
            grep -F "\"name\": \".NETCoreApp,Version=v10.0/linux-$1\"" \
              /App/Azure.DataApiBuilder.Service.deps.json
            test -x /App/Azure.DataApiBuilder.Service
            if launcher_output=$(ASPNETCORE_URLS=invalid /App/Azure.DataApiBuilder.Service 2>&1); then
              echo "Expected the launcher to reject an invalid ASPNETCORE_URLS" >&2
              exit 1
            fi
            if ! printf "%s\n" "$launcher_output" | grep -F "Invalid ASPNETCORE_URLS format"; then
              printf "%s\n" "$launcher_output" >&2
              exit 1
            fi
            if [ "$2" = runtime-nonroot ]; then
              test "$(id -u)" = "$APP_UID"
              touch /App/logs/container-test
            else
              test "$(id -u)" = 0
            fi
          ' sh "$ARCH" "$TARGET"
      - name: Check application startup and REST read
        run: |
          set -euo pipefail

          postgres_container="${{ job.services.postgres.id }}"
          docker cp samples/getting-started/azure-postgresql/library.postgresql.sql \
            "$postgres_container:/tmp/library.sql"
          docker exec "$postgres_container" psql -U dab -d dab -v ON_ERROR_STOP=1 -f /tmp/library.sql

          config_file="$RUNNER_TEMP/dab-smoke-config.json"
          cat > "$config_file" <<'EOF'
          {
            "data-source": {
              "database-type": "postgresql",
              "connection-string": "@env('DAB_CONNECTION_STRING')",
              "options": {}
            },
            "runtime": {
              "rest": { "enabled": true, "path": "/api" },
              "graphql": { "enabled": false },
              "mcp": { "enabled": false },
              "host": {
                "authentication": { "provider": "StaticWebApps" },
                "mode": "development"
              }
            },
            "entities": {
              "Book": {
                "source": { "object": "books", "type": "table" },
                "rest": { "enabled": true },
                "permissions": [
                  { "role": "anonymous", "actions": [{ "action": "read" }] }
                ]
              }
            }
          }
          EOF

          docker run -d --name dab-smoke --network host \
            -e 'DAB_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=dab;Username=dab;Password=dab;SSL Mode=Disable' \
            -v "$config_file:/App/dab-config.json:ro" \
            dab:container-test
          trap 'docker rm -f dab-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health > "$RUNNER_TEMP/dab-health.json"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs dab-smoke
              echo "DAB did not become healthy" >&2
              exit 1
            fi
            sleep 2
          done
          grep -F '"status": "Healthy"' "$RUNNER_TEMP/dab-health.json"

          curl --fail --silent http://127.0.0.1:5000/api/Book \
            | grep -F 'Prelude to Foundation'
